services:
  postgres:
    image: postgres:16-alpine
    container_name: church-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: church_db
      POSTGRES_USER: church_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-church_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # port 5432 not exposed to host in production; use docker-compose.dev.yml for local tools
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U church_admin -d church_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: church-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/church_db
      DB_USERNAME: church_admin
      DB_PASSWORD: ${DB_PASSWORD:-church_pass}
      JWT_SECRET: ${JWT_SECRET:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_NOTIFY_TO: ${MAIL_NOTIFY_TO:-info@fhbck.org}
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: http://fhbckissimmee.org,http://www.fhbckissimmee.org,https://fhbckissimmee.org,https://www.fhbckissimmee.org
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: church-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
  logs_data:
